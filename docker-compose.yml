services:
  bidhaan-logoedit:
    build: .
    container_name: bidhaan-logoedit
    restart: unless-stopped
    # FULL PRIORITY (John 2026-09-27): all 8 cores + the top CPU weight, so under load the
    # scheduler gives this bot the machine (measured: 91% vs 8 busy SSH jobs). The host side:
    # user.slice CPUWeight=10 (systemctl set-property) -- jobs launched over SSH yield.
    cpus: 8
    cpu_shares: 262144 # cgroup v2 cpu.weight 10000 (max); everything else has 100
    env_file: .env
    environment:
      - TZ=UTC
      # brand.py inside the engine imports the bot's branding.py from here, so
      # the path must be identical inside the container and on the host.
      - BIDHAAN_DIR=/opt/Bidhanlogoedit
    volumes:
      - bot_data:/app/data
      - ./assets:/app/assets:ro

      # ---- dub-sync engine -------------------------------------------------
      # Mounted at the SAME paths the host uses, because the venv's shebangs and
      # brand.py's import path are absolute. Mounting them elsewhere would break
      # both.
      - /opt/dubsync2:/opt/dubsync2
      - /opt/dubsync:/opt/dubsync
      # The venv's python is a symlink into uv's store, so the interpreter it
      # points at has to be visible too or nothing in .venv/bin will run.
      - /root/.local/share/uv/python:/root/.local/share/uv/python:ro
      # The engine imports the bot's own branding code (single source of truth
      # for logo placement); read-only so a bug in the engine can never edit it.
      - /opt/Bidhanlogoedit:/opt/Bidhanlogoedit:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
